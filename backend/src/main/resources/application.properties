# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
spring.application.name=AiGymTrainerApplication

# ===============================
# MONGODB CONFIGURATION
# ===============================
spring.data.mongodb.uri=${MONGODB_URI}

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=36000000

# ===============================
# EMAIL CONFIGURATION (SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=true
mail.from=${MAIL_USERNAME}
mail.from.name=FitAI Pro Support

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
logging.level.com.iar.backend=DEBUG
logging.level.com.sun.mail.smtp=DEBUG
logging.level.javax.mail.internet=DEBUG

# =======================================================================================
# Disable devtools automatic restart classloader to avoid runtime ClassNotFound issues
# =======================================================================================
spring.devtools.restart.enabled=false

# ===============================
# GOOGLE OAUTH
# ===============================
google.oauth.client-id=${GOOGLE_CLIENT_ID}

# ================================
# GEMINI
# ================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# ===============================
# Add Groq as primary
# ===============================
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions